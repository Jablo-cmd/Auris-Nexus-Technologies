name: SEO QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: sitemap lastmod dates come from each page's last commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate generator script syntax
        run: node --check tools/rebuild_chrome.js
      - name: Regenerate organization logo schema
        run: |
          python tools/build_schema.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "chore: update generated organization logo metadata [skip ci]"
            git push
          fi
      - name: Structured data is up to date
        run: python tools/build_schema.py --check
      - name: Reading-time labels are consistent
        run: python tools/reading_times.py --check
      - name: Sitemap is up to date
        run: python tools/build_sitemap.py --check
      - name: Run static SEO and production QA
        run: python tools/qa_audit.py
